<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Launcher – Download</title>
  <meta name="description" content="Öffne alles, was du für ein Projekt brauchst, mit einem Klick: Webseiten, Terminals, Ordner und Dateien. Kostenlos für macOS, Windows und Linux." />
  <link rel="icon" href="icon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0c131b 0%, #16222e 60%, #0c131b 100%);
      color: rgba(244, 247, 250, 0.94);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
      text-align: center;
    }
    .icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    h1 {
      margin-top: 20px;
      font-size: 34px;
      background: linear-gradient(180deg, #9dc0da, #5e88ab);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tagline { margin-top: 10px; font-size: 17px; color: rgba(198, 218, 233, 0.75); max-width: 560px; line-height: 1.5; }
    .features { margin-top: 18px; font-size: 14px; color: rgba(198, 218, 233, 0.6); max-width: 560px; line-height: 1.7; }
    .buttons { margin-top: 34px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 380px; }
    a.btn {
      display: block;
      padding: 14px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      background: rgba(170, 205, 232, 0.1);
      color: rgba(244, 247, 250, 0.9);
      border: 1px solid rgba(170, 205, 232, 0.18);
      transition: 0.15s;
    }
    a.btn:hover { background: rgba(170, 205, 232, 0.2); }
    a.btn.primary {
      background: linear-gradient(180deg, #9dc0da, #5e88ab);
      color: #0c1826;
      border: none;
    }
    a.btn.primary:hover { filter: brightness(1.1); }
    .btn small { display: block; font-weight: 500; font-size: 12px; opacity: 0.75; margin-top: 2px; }
    .note {
      margin-top: 36px;
      max-width: 560px;
      background: rgba(170, 205, 232, 0.07);
      border: 1px solid rgba(170, 205, 232, 0.14);
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 13.5px;
      line-height: 1.65;
      color: rgba(220, 233, 243, 0.85);
      text-align: left;
    }
    .note b { color: #9dc0da; }
    .note code, .modal-body code {
      display: inline-block;
      background: rgba(12, 19, 27, 0.7);
      border: 1px solid rgba(170, 205, 232, 0.2);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 4px 0;
      font-size: 12.5px;
      color: #c6dae9;
      cursor: pointer;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .note code:hover, .modal-body code:hover { background: rgba(12, 19, 27, 0.95); }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 9, 14, 0.72);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .overlay[hidden] { display: none; }
    .modal {
      background: linear-gradient(160deg, #182634, #0e1822);
      border: 1px solid rgba(170, 205, 232, 0.25);
      border-radius: 20px;
      padding: 26px 24px 22px;
      max-width: 540px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      text-align: left;
    }
    .modal h2 { font-size: 20px; color: #9dc0da; text-align: center; }
    .modal .modal-sub { text-align: center; font-size: 13.5px; color: rgba(198, 218, 233, 0.65); margin: 6px 0 16px; }
    .modal-body { font-size: 13.5px; line-height: 1.65; color: rgba(220, 233, 243, 0.88); }
    .modal-body b { color: #9dc0da; }
    .modal-close {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px 22px;
      border: none;
      border-radius: 14px;
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      background: linear-gradient(180deg, #9dc0da, #5e88ab);
      color: #0c1826;
      cursor: pointer;
    }
    .modal-close:hover { filter: brightness(1.1); }
    footer { margin-top: 40px; font-size: 13px; color: rgba(198, 218, 233, 0.5); line-height: 1.7; }
    footer a { color: #85b4d6; }
  </style>
</head>
<body>
  <img class="icon" src="icon.png" alt="Project Launcher" />
  <h1>Project Launcher</h1>
  <p class="tagline" data-de="Öffne alles, was du für ein Projekt brauchst, mit einem Klick.<br />Webseiten · Terminals · Ordner · Dateien"
     data-en="Open everything you need for a project in one click.<br />Websites · Terminals · Folders · Files">
  </p>
  <p class="features" data-de="🗂️ Projekte mit Emoji oder eigenem Logo · 🚀 Ganzen Arbeitsplatz mit einem Klick starten · 🏷️ Benennbare Farbgruppen · 🎨 12 Farbschemata · 📍 Auf dem Desktop fixierbar · 🌍 Deutsch &amp; Englisch · 💯 Kostenlos &amp; Open Source"
     data-en="🗂️ Projects with emoji or your own logo · 🚀 Launch your whole workspace in one click · 🏷️ Nameable color groups · 🎨 12 color schemes · 📍 Pin it to your desktop · 🌍 German &amp; English · 💯 Free &amp; open source">
  </p>

  <div class="buttons" id="buttons"></div>

  <div class="note" id="note"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="modal-title"></h2>
      <p class="modal-sub" id="modal-sub"></p>
      <div class="modal-body" id="modal-body"></div>
      <button class="modal-close" id="modal-close"></button>
    </div>
  </div>

  <footer>
    <span data-de="Kostenlos · Open Source (MIT) · Keine Datensammlung"
          data-en="Free · Open source (MIT) · No data collection"></span><br />
    <a href="https://github.com/klennerlab/project-launcher">GitHub</a> ·
    <a href="https://github.com/klennerlab/project-launcher/releases" data-de="Alle Versionen" data-en="All releases"></a>
  </footer>

  <script>
    const BASE = 'https://github.com/klennerlab/project-launcher/releases/latest/download/';
    const DL = {
      macArm: BASE + 'project-launcher-mac-arm64.dmg',
      macIntel: BASE + 'project-launcher-mac-x64.dmg',
      win: BASE + 'project-launcher-setup-windows.exe',
      linux: BASE + 'project-launcher-linux-x64.AppImage'
    };

    const de = navigator.language.toLowerCase().startsWith('de');
    document.documentElement.lang = de ? 'de' : 'en';
    document.querySelectorAll('[data-de]').forEach((el) => {
      el.innerHTML = de ? el.dataset.de : el.dataset.en;
    });

    const ua = navigator.userAgent;
    const isMac = /Macintosh|Mac OS X/.test(ua);
    const isWin = /Windows/.test(ua);
    const isLinux = /Linux/.test(ua) && !/Android/.test(ua);

    const t = de
      ? {
          macArm: 'Für Mac herunterladen', macArmSub: 'Apple Silicon (M1–M4, ab 2020)',
          macIntel: 'Für ältere Macs (Intel)', win: 'Für Windows herunterladen', winSub: 'Windows 10/11',
          linux: 'Für Linux herunterladen', linuxSub: 'AppImage (Ubuntu, Mint, Fedora …)',
          noteLinux: '<b>Nach dem Download (Linux):</b> Datei einmal ausführbar machen (Rechtsklick → Eigenschaften → „Als Programm ausführen“ aktivieren) und dann doppelklicken.',
          noteMac: '<b>Nach dem Download (Mac):</b> Datei öffnen und die App in den <b>Programme</b>-Ordner ziehen – danach findest du sie bei deinen Apps, im Launchpad und über die Suche (Cmd&nbsp;+&nbsp;Leertaste).<br /><br /><b>Wichtig beim ersten Start:</b> macOS meldet „Project Launcher.app ist beschädigt“. Die App ist <b>nicht</b> beschädigt – sie ist nur nicht bei Apple registriert (das kostet Gebühren; der Code ist offen einsehbar auf GitHub). Einmalig freischalten: <b>Terminal</b> öffnen (Cmd&nbsp;+&nbsp;Leertaste, „Terminal“ tippen), diesen Befehl einfügen (anklicken zum Kopieren) und Enter drücken:<br /><code class="cmd" title="Klicken zum Kopieren">xattr -d com.apple.quarantine "/Applications/Project Launcher.app"</code><br />Danach startet die App ganz normal. Tipp: Im ⋯-Menü „Beim Anmelden starten“ aktivieren, dann ist dein Kästchen nach jedem Start automatisch da.',
          noteWin: '<b>Nach dem Download (Windows):</b> Datei doppelklicken – die App installiert sich automatisch und erscheint im Startmenü. Falls SmartScreen warnt: <b>„Weitere Informationen“ → „Trotzdem ausführen“</b>.',
          modalTitle: '⬇️ Dein Download läuft!', modalSub: 'So installierst du die App, sobald der Download fertig ist:', modalClose: 'Alles klar!'
        }
      : {
          macArm: 'Download for Mac', macArmSub: 'Apple Silicon (M1–M4, 2020 or later)',
          macIntel: 'For older Macs (Intel)', win: 'Download for Windows', winSub: 'Windows 10/11',
          linux: 'Download for Linux', linuxSub: 'AppImage (Ubuntu, Mint, Fedora …)',
          noteLinux: '<b>After downloading (Linux):</b> make the file executable once (right-click → Properties → enable “Run as a program”), then double-click it.',
          noteMac: '<b>After downloading (Mac):</b> open the file and drag the app into your <b>Applications</b> folder – you will then find it with your apps, in Launchpad and via search (Cmd&nbsp;+&nbsp;Space).<br /><br /><b>Important on first launch:</b> macOS will say “Project Launcher.app is damaged”. The app is <b>not</b> damaged – it is simply not registered with Apple (that costs fees; the code is openly available on GitHub). Unlock it once: open <b>Terminal</b> (Cmd&nbsp;+&nbsp;Space, type “Terminal”), paste this command (click to copy) and press Enter:<br /><code class="cmd" title="Click to copy">xattr -d com.apple.quarantine "/Applications/Project Launcher.app"</code><br />After that the app opens normally. Tip: enable “Start at login” in the ⋯ menu so your box is there after every restart.',
          noteWin: '<b>After downloading (Windows):</b> double-click the file – the app installs automatically and appears in your Start menu. If SmartScreen warns you: <b>“More info” → “Run anyway”</b>.',
          modalTitle: '⬇️ Your download has started!', modalSub: 'Here is how to install the app once the download finishes:', modalClose: 'Got it!'
        };

    const buttons = [];
    if (isWin) {
      buttons.push({ href: DL.win, label: t.win, sub: t.winSub, primary: true, platform: 'win' });
      buttons.push({ href: DL.macArm, label: t.macArm, sub: t.macArmSub, platform: 'mac' });
      buttons.push({ href: DL.linux, label: t.linux, sub: t.linuxSub, platform: 'linux' });
    } else if (isLinux) {
      buttons.push({ href: DL.linux, label: t.linux, sub: t.linuxSub, primary: true, platform: 'linux' });
      buttons.push({ href: DL.macArm, label: t.macArm, sub: t.macArmSub, platform: 'mac' });
      buttons.push({ href: DL.win, label: t.win, sub: t.winSub, platform: 'win' });
    } else {
      buttons.push({ href: DL.macArm, label: t.macArm, sub: t.macArmSub, primary: isMac, platform: 'mac' });
      buttons.push({ href: DL.macIntel, label: t.macIntel, platform: 'mac' });
      buttons.push({ href: DL.win, label: t.win, sub: t.winSub, platform: 'win' });
      buttons.push({ href: DL.linux, label: t.linux, sub: t.linuxSub, platform: 'linux' });
    }

    document.getElementById('buttons').innerHTML = buttons
      .map((b) => `<a class="btn${b.primary ? ' primary' : ''}" href="${b.href}" data-platform="${b.platform}">${b.label}${b.sub ? `<small>${b.sub}</small>` : ''}</a>`)
      .join('');

    document.getElementById('note').innerHTML = isLinux
      ? t.noteLinux
      : isWin
        ? t.noteWin
        : t.noteMac + '<br /><br />' + t.noteWin;

    // Popup with the matching instructions when a download starts
    const overlay = document.getElementById('overlay');
    document.getElementById('modal-title').textContent = t.modalTitle;
    document.getElementById('modal-sub').textContent = t.modalSub;
    document.getElementById('modal-close').textContent = t.modalClose;

    const platformNotes = { mac: t.noteMac, win: t.noteWin, linux: t.noteLinux };
    document.getElementById('buttons').addEventListener('click', (e) => {
      const btn = e.target.closest('a.btn');
      if (!btn) return;
      // Do not preventDefault – the browser keeps downloading in the background.
      document.getElementById('modal-body').innerHTML = platformNotes[btn.dataset.platform] || '';
      overlay.hidden = false;
    });
    const closeModal = () => { overlay.hidden = true; };
    document.getElementById('modal-close').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // Click-to-copy for the Terminal command (works in the note and in the popup)
    document.addEventListener('click', (e) => {
      const code = e.target.closest('code.cmd');
      if (!code || code.dataset.busy) return;
      const original = code.textContent;
      navigator.clipboard.writeText(original).then(() => {
        code.dataset.busy = '1';
        code.textContent = de ? '✓ Kopiert – jetzt im Terminal einfügen' : '✓ Copied – now paste it into Terminal';
        setTimeout(() => { code.textContent = original; delete code.dataset.busy; }, 2000);
      });
    });
  </script>
</body>
</html>
