<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Desktop Order – Download</title>
  <meta name="description" content="Ein Projekt-Kästchen für deinen Desktop – organisiere Webseiten in Projekten und öffne sie mit einem Klick. Kostenlos für macOS und Windows." />
  <link rel="icon" href="icon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0c131b 0%, #16222e 60%, #0c131b 100%);
      color: rgba(244, 247, 250, 0.94);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 60px;
      text-align: center;
    }
    .icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    h1 {
      margin-top: 20px;
      font-size: 34px;
      background: linear-gradient(180deg, #9dc0da, #5e88ab);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .tagline { margin-top: 10px; font-size: 17px; color: rgba(198, 218, 233, 0.75); max-width: 560px; line-height: 1.5; }
    .features { margin-top: 18px; font-size: 14px; color: rgba(198, 218, 233, 0.6); max-width: 560px; line-height: 1.7; }
    .buttons { margin-top: 34px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 380px; }
    a.btn {
      display: block;
      padding: 14px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      background: rgba(170, 205, 232, 0.1);
      color: rgba(244, 247, 250, 0.9);
      border: 1px solid rgba(170, 205, 232, 0.18);
      transition: 0.15s;
    }
    a.btn:hover { background: rgba(170, 205, 232, 0.2); }
    a.btn.primary {
      background: linear-gradient(180deg, #9dc0da, #5e88ab);
      color: #0c1826;
      border: none;
    }
    a.btn.primary:hover { filter: brightness(1.1); }
    .btn small { display: block; font-weight: 500; font-size: 12px; opacity: 0.75; margin-top: 2px; }
    .note {
      margin-top: 36px;
      max-width: 560px;
      background: rgba(170, 205, 232, 0.07);
      border: 1px solid rgba(170, 205, 232, 0.14);
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 13.5px;
      line-height: 1.65;
      color: rgba(220, 233, 243, 0.85);
      text-align: left;
    }
    .note b { color: #9dc0da; }
    footer { margin-top: 40px; font-size: 13px; color: rgba(198, 218, 233, 0.5); line-height: 1.7; }
    footer a { color: #85b4d6; }
  </style>
</head>
<body>
  <img class="icon" src="icon.png" alt="My Desktop Order" />
  <h1>My Desktop Order</h1>
  <p class="tagline" data-de="Dein Projekt-Kästchen für den Desktop: Webseiten in Projekten organisieren und mit einem Klick gesammelt öffnen – in einem frischen Browser-Fenster."
     data-en="Your project box for the desktop: organize websites into projects and open them together with one click – in a fresh browser window.">
  </p>
  <p class="features" data-de="🗂️ Projekte mit Emoji oder eigenem Logo · 🚀 Alle oder ausgewählte Seiten öffnen · 🎨 10 Farbschemata · 📍 Auf dem Desktop fixierbar · 🌍 Deutsch &amp; Englisch · 💯 Kostenlos &amp; Open Source"
     data-en="🗂️ Projects with emoji or your own logo · 🚀 Open all or selected sites · 🎨 10 color schemes · 📍 Pin it to your desktop · 🌍 German &amp; English · 💯 Free &amp; open source">
  </p>

  <div class="buttons" id="buttons"></div>

  <div class="note" id="note"></div>

  <footer>
    <span data-de="Kostenlos · Open Source (MIT) · Keine Datensammlung"
          data-en="Free · Open source (MIT) · No data collection"></span><br />
    <a href="https://github.com/klennerlab/MyDesktopOrder">GitHub</a> ·
    <a href="https://github.com/klennerlab/MyDesktopOrder/releases" data-de="Alle Versionen" data-en="All releases"></a>
  </footer>

  <script>
    const BASE = 'https://github.com/klennerlab/MyDesktopOrder/releases/latest/download/';
    const DL = {
      macArm: BASE + 'my-desktop-order-mac-arm64.dmg',
      macIntel: BASE + 'my-desktop-order-mac-x64.dmg',
      win: BASE + 'my-desktop-order-setup-windows.exe'
    };

    const de = navigator.language.toLowerCase().startsWith('de');
    document.documentElement.lang = de ? 'de' : 'en';
    document.querySelectorAll('[data-de]').forEach((el) => {
      el.innerHTML = de ? el.dataset.de : el.dataset.en;
    });

    const ua = navigator.userAgent;
    const isMac = /Macintosh|Mac OS X/.test(ua);
    const isWin = /Windows/.test(ua);

    const t = de
      ? {
          macArm: 'Für Mac herunterladen', macArmSub: 'Apple Silicon (M1–M4, ab 2020)',
          macIntel: 'Für ältere Macs (Intel)', win: 'Für Windows herunterladen', winSub: 'Windows 10/11',
          noteMac: '<b>Nach dem Download (Mac):</b> Datei öffnen und die App in den <b>Programme</b>-Ordner ziehen – danach findest du sie bei deinen Apps, im Launchpad und über die Suche (Cmd&nbsp;+&nbsp;Leertaste). Beim allerersten Start: <b>Rechtsklick → „Öffnen“ → „Öffnen“</b> (die App ist nicht bei Apple registriert, das kostet Gebühren – der Code ist offen einsehbar auf GitHub). Tipp: Im ⋯-Menü „Beim Anmelden starten“ aktivieren, dann ist dein Kästchen nach jedem Start automatisch da.',
          noteWin: '<b>Nach dem Download (Windows):</b> Datei doppelklicken – die App installiert sich automatisch und erscheint im Startmenü. Falls SmartScreen warnt: <b>„Weitere Informationen“ → „Trotzdem ausführen“</b>.'
        }
      : {
          macArm: 'Download for Mac', macArmSub: 'Apple Silicon (M1–M4, 2020 or later)',
          macIntel: 'For older Macs (Intel)', win: 'Download for Windows', winSub: 'Windows 10/11',
          noteMac: '<b>After downloading (Mac):</b> open the file and drag the app into your <b>Applications</b> folder – you will then find it with your apps, in Launchpad and via search (Cmd&nbsp;+&nbsp;Space). On the very first launch: <b>right-click → “Open” → “Open”</b> (the app is not registered with Apple – that costs fees; the code is openly available on GitHub). Tip: enable “Start at login” in the ⋯ menu so your box is there after every restart.',
          noteWin: '<b>After downloading (Windows):</b> double-click the file – the app installs automatically and appears in your Start menu. If SmartScreen warns you: <b>“More info” → “Run anyway”</b>.'
        };

    const buttons = [];
    if (isWin) {
      buttons.push({ href: DL.win, label: t.win, sub: t.winSub, primary: true });
      buttons.push({ href: DL.macArm, label: t.macArm, sub: t.macArmSub });
    } else {
      buttons.push({ href: DL.macArm, label: t.macArm, sub: t.macArmSub, primary: isMac });
      buttons.push({ href: DL.macIntel, label: t.macIntel });
      buttons.push({ href: DL.win, label: t.win, sub: t.winSub, primary: isWin });
    }

    document.getElementById('buttons').innerHTML = buttons
      .map((b) => `<a class="btn${b.primary ? ' primary' : ''}" href="${b.href}">${b.label}${b.sub ? `<small>${b.sub}</small>` : ''}</a>`)
      .join('');

    document.getElementById('note').innerHTML = isWin ? t.noteWin : t.noteMac + '<br /><br />' + t.noteWin;
  </script>
</body>
</html>
