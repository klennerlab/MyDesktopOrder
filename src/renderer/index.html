<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'" />
  <title>My Desktop Order</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="widget" id="widget">

    <header class="drag">
      <div class="header-title"><span id="header-title">Meine Projekte</span></div>
      <div class="header-buttons no-drag">
        <button id="btn-menu" class="icon-btn" title="">⋯</button>
        <button id="btn-lock" class="icon-btn" title="">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 17v5" />
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Home: project grid -->
    <main id="view-home">
      <input id="search-input" type="text" class="search-input no-drag" />
      <div id="project-grid" class="project-grid"></div>
      <div id="search-results" class="site-list" hidden></div>
      <div id="search-empty" class="empty-state" hidden>
        <div class="empty-icon">🔍</div>
        <p id="search-empty-text"></p>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">🗂️</div>
        <p id="empty-text"></p>
      </div>
    </main>

    <!-- Project detail -->
    <main id="view-project" hidden>
      <div class="project-head no-drag">
        <button id="btn-back" class="icon-btn" title=""></button>
        <div class="project-head-title">
          <span id="project-icon"></span>
          <span id="project-name"></span>
        </div>
        <button id="btn-edit-project" class="icon-btn" title="">✎</button>
        <button id="btn-delete-project" class="icon-btn danger" title="">🗑</button>
      </div>

      <p id="project-note" class="project-note" hidden></p>
      <div class="project-actions">
        <button id="btn-open-all" class="primary"></button>
        <button id="btn-open-selected" class="secondary" disabled></button>
        <div id="add-buttons" class="add-row"></div>
      </div>
      <div id="group-chips" class="group-chips" hidden></div>
      <input id="project-search" type="text" class="search-input no-drag" />
      <div id="site-list" class="site-list"></div>
      <div id="site-empty" class="empty-state" hidden>
        <div class="empty-icon">🔗</div>
        <p id="site-empty-text"></p>
      </div>
    </main>

    <footer id="footer-home">
      <button id="btn-new-project" class="primary wide"></button>
    </footer>

    <!-- Modal: create / edit project -->
    <div id="modal-project" class="overlay" hidden>
      <div class="modal">
        <h3 id="modal-project-title"></h3>
        <label id="label-project-name"></label>
        <input id="input-project-name" type="text" maxlength="40" />
        <label id="label-project-note"></label>
        <textarea id="input-project-note" rows="2" maxlength="1000"></textarea>
        <label id="label-project-types"></label>
        <div id="type-grid" class="type-grid"></div>
        <label id="label-project-icon"></label>
        <div id="emoji-grid" class="emoji-grid"></div>
        <button id="btn-toggle-emojis" class="ghost toggle-emojis" type="button"></button>
        <label id="label-project-logo" hidden></label>
        <div id="logo-grid" class="emoji-grid"></div>
        <button id="btn-upload-logo" class="ghost toggle-emojis" type="button"></button>
        <div class="modal-buttons">
          <button id="btn-project-cancel" class="ghost"></button>
          <button id="btn-project-save" class="primary"></button>
        </div>
      </div>
    </div>

    <!-- Modal: add site -->
    <div id="modal-site" class="overlay" hidden>
      <div class="modal">
        <h3 id="modal-site-title"></h3>
        <label id="label-site-url"></label>
        <input id="input-site-url" type="text" placeholder="https://…" />
        <label id="label-site-name"></label>
        <input id="input-site-name" type="text" maxlength="60" />
        <label id="label-site-note"></label>
        <textarea id="input-site-note" rows="2" maxlength="500"></textarea>
        <div class="modal-buttons">
          <button id="btn-site-cancel" class="ghost"></button>
          <button id="btn-site-save" class="primary"></button>
        </div>
      </div>
    </div>

    <!-- Modal: color scheme picker -->
    <div id="modal-scheme" class="overlay" hidden>
      <div class="modal">
        <div class="modal-head">
          <h3 id="modal-scheme-title"></h3>
          <button id="btn-scheme-close" class="icon-btn check" title="">✓</button>
        </div>
        <div id="scheme-grid" class="scheme-grid"></div>
      </div>
    </div>

    <!-- Modal: add/edit terminal, folder or file item -->
    <div id="modal-item" class="overlay" hidden>
      <div class="modal">
        <h3 id="modal-item-title"></h3>
        <label id="label-item-path"></label>
        <button id="btn-pick-path" class="ghost" type="button"></button>
        <div id="picked-path" class="picked-path" hidden></div>
        <label id="label-item-command" hidden></label>
        <input id="input-item-command" type="text" maxlength="500" hidden />
        <label id="label-item-name"></label>
        <input id="input-item-name" type="text" maxlength="60" />
        <div class="modal-buttons">
          <button id="btn-item-cancel" class="ghost"></button>
          <button id="btn-item-save" class="primary"></button>
        </div>
      </div>
    </div>

    <!-- Modal: pick group color for an item, with per-project group names -->
    <div id="modal-color" class="overlay" hidden>
      <div class="modal">
        <div class="modal-head">
          <h3 id="modal-color-title"></h3>
          <button id="btn-color-close" class="icon-btn check" title="">✓</button>
        </div>
        <p id="color-hint" class="color-hint"></p>
        <div id="color-grid" class="color-grid"></div>
        <div id="color-divider" class="color-divider" hidden></div>
        <div id="color-name-row" class="color-row" hidden></div>
      </div>
    </div>

    <!-- Modal: delete project (requires typing the project name) -->
    <div id="modal-delete-project" class="overlay" hidden>
      <div class="modal">
        <h3 id="delete-project-title"></h3>
        <p id="delete-project-message" class="confirm-message"></p>
        <input id="input-delete-name" type="text" />
        <div class="modal-buttons">
          <button id="btn-delete-cancel" class="ghost"></button>
          <button id="btn-delete-confirm" class="danger-filled" disabled></button>
        </div>
      </div>
    </div>

    <!-- Modal: confirm (delete etc.) -->
    <div id="modal-confirm" class="overlay" hidden>
      <div class="modal">
        <p id="confirm-message" class="confirm-message"></p>
        <div class="modal-buttons">
          <button id="btn-confirm-cancel" class="ghost"></button>
          <button id="btn-confirm-ok" class="danger-filled"></button>
        </div>
      </div>
    </div>

    <!-- Modal: import / export -->
    <div id="modal-data" class="overlay" hidden>
      <div class="modal">
        <h3 id="modal-data-title"></h3>
        <div class="choice-list">
          <button id="btn-import-bookmarks" class="choice-option"></button>
          <button id="btn-import-file" class="choice-option"></button>
          <button id="btn-export-file" class="choice-option"></button>
          <button id="btn-export-html" class="choice-option"></button>
        </div>
        <p id="data-status" class="data-status" hidden></p>
      </div>
    </div>

    <!-- Modal: pick bookmark folders to import -->
    <div id="modal-bookmarks" class="overlay" hidden>
      <div class="modal">
        <h3 id="modal-bookmarks-title"></h3>
        <div id="bookmark-list" class="choice-list"></div>
        <div class="modal-buttons">
          <button id="btn-bookmarks-cancel" class="ghost"></button>
          <button id="btn-bookmarks-import" class="primary"></button>
        </div>
      </div>
    </div>

    <!-- Modal: language picker -->
    <div id="modal-language" class="overlay" hidden>
      <div class="modal">
        <h3 id="modal-language-title"></h3>
        <div id="language-list" class="choice-list"></div>
      </div>
    </div>

    <!-- Modal: autostart picker -->
    <div id="modal-autostart" class="overlay" hidden>
      <div class="modal">
        <h3 id="modal-autostart-title"></h3>
        <div id="autostart-list" class="choice-list"></div>
      </div>
    </div>

    <!-- Modal: window layer picker -->
    <div id="modal-layer" class="overlay" hidden>
      <div class="modal">
        <h3 id="modal-layer-title"></h3>
        <div id="layer-list" class="choice-list"></div>
      </div>
    </div>

    <!-- Dropdown menu -->
    <div id="menu" class="menu no-drag" hidden>
      <button id="menu-language" class="menu-item"></button>
      <button id="menu-scheme" class="menu-item"></button>
      <button id="menu-ontop" class="menu-item"></button>
      <button id="menu-autostart" class="menu-item"></button>
      <button id="menu-data" class="menu-item"></button>
      <button id="menu-github" class="menu-item"></button>
      <button id="menu-hide" class="menu-item"></button>
      <button id="menu-quit" class="menu-item danger"></button>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
